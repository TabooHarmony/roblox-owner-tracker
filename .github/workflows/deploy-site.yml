# Deploy the static viewer to GitHub Pages on every push to main.
# The site's only data inputs are site/anchors_eligible.json and
# site/rerelease_post2020.json, both built from anchors/anchors_harden.jsonl
# by pipeline/build_site_data.py. Deploy deploys whatever is committed.
name: deploy-site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
