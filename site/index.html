<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roblox owner tracker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #101418; color: #e6e8ea;
         margin: 0; padding: 3rem 1rem; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 1.5rem; }
  h1 a { color: #9aa3ab; text-decoration: none; font-weight: 400; margin-left: .4rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input { flex: 1; padding: .65rem .9rem; font-size: 1rem; border-radius: 8px;
          border: 1px solid #2a333c; background: #161c22; color: #e6e8ea; }
  button { padding: .65rem 1.1rem; font-size: 1rem; border-radius: 8px; border: 0;
           background: #2f6fdb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .r { display: none; }
  .name { font-size: 1.1rem; font-weight: 600; }
  .num { font-size: 2.4rem; font-weight: 700; margin: .5rem 0 .1rem; }
  .cap { color: #9aa3ab; font-size: .8rem; }
  .ev { color: #9aa3ab; font-size: .8rem; margin-top: 1rem; line-height: 1.7; }
  .msg { color: #9aa3ab; margin-top: .8rem; }
  .fail { color: #e08a96; }
  .foot { color: #556069; font-size: .75rem; margin-top: 3rem; }
  .foot a { color: #556069; }
</style>
</head>
<body>
<main>
  <h1>roblox owner tracker <a href="https://github.com/TabooHarmony/roblox-owner-tracker">github</a></h1>
  <form id="f">
    <input id="id" inputmode="numeric" pattern="\d*" placeholder="catalog id" autocomplete="off" autofocus>
    <button id="go" type="submit" disabled>→</button>
  </form>
  <div id="out"></div>
  <div class="foot">method by maggy · brackets are intervals, not exact counts · roblox-published items only</div>
</main>
<script>
"use strict";
let ANCHORS = null;
const PX = "https://rbx-proxy.tabooharmony.workers.dev/";
const KW = " red orange yellow green blue pink white";
const PR = "&Limit=120&SortType=2&SortAggregation=5&IncludeNotForSale=true&CreatorName=Roblox&CreatorType=User";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => Number(n).toLocaleString("en-US");
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

async function fetchPx(path, tries) {
  let err;
  for (let i = 0; i <= tries; i++) {
    try {
      const r = await fetch(PX + path);
      if (r.status === 429 && i < tries) { await sleep(12000); continue; }
      if (!r.ok) throw new Error("API " + r.status);
      return await r.json();
    } catch (e) {
      if (e.name === "AbortError" && i < tries) { await sleep(4000); continue; }
      err = e;
    }
  }
  throw err;
}

async function lookup(id) {
  const out = document.getElementById("out");
  const show = h => out.innerHTML = h;
  if (!/^\d+$/.test(id)) return show('<div class="msg fail">numeric catalog id</div>');
  show('<div class="msg">…</div>');

  let m;
  try { m = await fetchPx("economy.roblox.com/v2/assets/" + id + "/details", 0); }
  catch (e) { return show('<div class="msg fail">could not fetch item</div>'); }
  if (!m || !m.Name) return show('<div class="msg fail">could not fetch item</div>');

  const head = '<div class="name">' + esc(m.Name) + '</div>';
  if ((m.Creator && m.Creator.Name) !== "Roblox")
    return show(head + '<div class="msg">only roblox-published items</div>');

  const kw = m.Name + KW;
  show(head + '<div class="msg" id="p">searching…</div>');
  const p = document.getElementById("p");

  let cur = "", ids = [], pos = null, pages = 0;
  try {
    while (pages < 9 && pos === null) {
      const d = await fetchPx("catalog.roblox.com/v2/search/items/details?Keyword=" +
        encodeURIComponent(kw) + PR + (cur ? "&Cursor=" + encodeURIComponent(cur) : ""), 2);
      pages++;
      for (const it of d.data || []) {
        ids.push(String(it.id));
        if (String(it.id) === id) pos = ids.length; // 1-based
      }
      p.textContent = "searching… " + ids.length;
      if (pos !== null || !d.nextPageCursor || !(d.data || []).length) break;
      cur = d.nextPageCursor;
      await sleep(6500);
    }
  } catch (e) {
    return show(head + '<div class="msg fail">search failed — try again in a minute</div>');
  }

  if (pos === null)
    return show(head + '<div class="msg">no estimate — item not found in its sales neighborhood</div>');

  let above = null, below = null;
  for (let j = pos - 2; j >= 0; j--) if (ANCHORS[ids[j]]) { above = ANCHORS[ids[j]]; break; }
  for (let j = pos; j < ids.length; j++) if (ANCHORS[ids[j]]) { below = ANCHORS[ids[j]]; break; }

  let ev = "";
  const row = (a) => a ? '<div>↑ ' + fmt(a.p) + ' — ' + esc(a.t) + ' (' + esc(a.as_of || "") + ')</div>' : '';
  if (above) ev += row(above);
  if (below) ev += '<div>↓ ' + fmt(below.p) + ' — ' + esc(below.t) + ' (' + esc(below.as_of || "") + ')</div>';
  if (ev) ev = '<div class="ev">' + ev + '</div>';

  if (above && below && above.p > below.p)
    return show(head + '<div class="num">' + fmt(below.p) + ' – ' + fmt(above.p) + '</div><div class="cap">estimated purchases</div>' + ev);
  if (above || below)
    return show(head + '<div class="msg">no estimate — evidence on one side only</div>' + ev);
  return show(head + '<div class="msg">no estimate — no evidence nearby</div>');
}

(async () => {
  ANCHORS = await fetch("anchors_eligible.json").then(r => r.json());
  document.getElementById("go").disabled = false;
  const v = new URLSearchParams(location.search).get("id");
  if (v) { document.getElementById("id").value = v; lookup(v); }
})();
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = document.getElementById("id").value.trim();
  history.replaceState(null, "", "?id=" + encodeURIComponent(v));
  lookup(v);
});
</script>
</body>
</html>
