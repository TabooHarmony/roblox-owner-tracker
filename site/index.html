<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roblox-owner-tracker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #101418; color: #e6e8ea;
         margin: 0; padding: 2rem 1rem; }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .sub { color: #9aa3ab; font-size: .85rem; margin-bottom: 1.25rem; }
  .sub a { color: #7ab8ff; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input { flex: 1; padding: .6rem .8rem; font-size: 1rem; border-radius: 8px;
          border: 1px solid #3a444d; background: #1a2128; color: #e6e8ea; }
  button { padding: .6rem 1.1rem; font-size: 1rem; border-radius: 8px; border: 0;
           background: #2f6fdb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .card { border: 1px solid #2a333c; border-radius: 10px; padding: 1rem 1.1rem;
          background: #161c22; }
  .card h2 { font-size: 1.1rem; margin: 0 0 .15rem; }
  .meta { color: #9aa3ab; font-size: .8rem; margin-bottom: .7rem; }
  .bracket { font-size: 2rem; font-weight: 700; margin: .4rem 0; }
  .lbl { color: #9aa3ab; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
  .anchor { border-top: 1px solid #232c34; padding: .55rem 0; font-size: .85rem; }
  .anchor b { color: #cfd6dc; }
  .note { color: #9aa3ab; font-size: .8rem; margin-top: .6rem; }
  .warn { color: #d9c36a; font-size: .82rem; margin-top: .5rem; }
  .err  { color: #e08a96; font-size: .9rem; }
  .progress { color: #7ab8ff; font-size: .85rem; margin-top: .6rem; }
  details { margin-top: .8rem; font-size: .8rem; color: #9aa3ab; }
  details pre { white-space: pre-wrap; word-break: break-word; font-size: .72rem; }
</style>
</head>
<body>
<main>
  <h1>roblox-owner-tracker</h1>
  <div class="sub">live sales-rank bracketing for Roblox-published catalog items &middot;
    method by Maggy (Maggy Rarefication) &middot;
    <a href="https://github.com/TabooHarmony/roblox-owner-tracker">source</a></div>
  <form id="f">
    <input id="id" inputmode="numeric" pattern="\d*" placeholder="Roblox catalog ID" autocomplete="off">
    <button id="go" type="submit" disabled>Look up</button>
  </form>
  <div id="out"></div>
</main>
<script>
"use strict";

// ---------- data ----------
let ANCHORS = null; // { id -> {p, as_of, until, t} } — precomputed eligible closed-final anchors.
// Eligibility (applied at build time in pipeline, not here): closed sale, all windows
// resolved, paired count observed strictly after the last close, last close >= 2012,
// single-channel count, and no post-2020 re-release window (those carry stale counts,
// e.g. ASCII White's 360 count predates its Nov 2025 return).

// ---------- live walk ----------
const PX = "https://rbx-proxy.tabooharmony.workers.dev/";
const WALK_KW_SUFFIX = " red orange yellow green blue pink white";
const WALK_PARAMS = "&Limit=120&SortType=2&SortAggregation=5&IncludeNotForSale=true&CreatorName=Roblox&CreatorType=User";
const PAGE_DELAY_MS = 6500;
const MAX_PAGES = 9;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function fetchProxied(path, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 12000);
  try {
    const r = await fetch(PX + path, { signal: ctl.signal });
    if (!r.ok) throw new Error("API " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

// ---------- lookup ----------
async function lookup(idStr) {
  const out = document.getElementById("out");
  out.innerHTML = "";
  const id = String(idStr).trim();
  if (!/^\d+$/.test(id) || +id <= 0) {
    out.innerHTML = '<div class="card"><div class="err">Enter a numeric Roblox catalog ID.</div></div>';
    return;
  }
  const card = document.createElement("div");
  card.className = "card";
  card.textContent = "Fetching item…";
  out.appendChild(card);

  // 1. identity
  let meta = null;
  try {
    meta = await fetchProxied("economy.roblox.com/v2/assets/" + id + "/details", 8000);
  } catch (e) {}
  if (!meta || !meta.Name) {
    card.innerHTML = '<div class="err">Could not fetch this item from Roblox. The ID may not exist, or the API is down.</div>';
    return;
  }
  const name = meta.Name;
  const creator = (meta.Creator && meta.Creator.Name) || "?";

  // 2. Roblox-only scope
  if (creator !== "Roblox") {
    card.innerHTML = "<h2>" + esc(name) + "</h2>"
      + '<div class="meta">ID ' + fmt(+id) + " · by " + esc(creator) + "</div>"
      + '<div class="note">Only Roblox-published items are supported.</div>';
    return;
  }

  // 3. walk: full name + rainbow padding, all-time sales, Roblox creator filter
  const kw = name + WALK_KW_SUFFIX;
  let header = "<h2>" + esc(name) + "</h2>"
    + '<div class="meta">ID ' + fmt(+id)
    + (meta.Created ? " · created " + esc(String(meta.Created).slice(0, 10)) : "")
    + (meta.IsForSale ? " · still on sale" : " · off sale")
    + "</div>";
  card.innerHTML = header + '<div class="progress">walking…</div>';
  const prog = card.querySelector(".progress");

  let cursor = "", seen = 0, rank = null, flat = [];
  let pages = 0;
  try {
    while (pages < MAX_PAGES && rank === null) {
      const url = "catalog.roblox.com/v2/search/items/details?Keyword=" + encodeURIComponent(kw)
        + WALK_PARAMS + (cursor ? "&Cursor=" + encodeURIComponent(cursor) : "");
      const d = await fetchProxied(url, 15000);
      pages++;
      const data = d.data || [];
      for (const it of data) {
        seen++;
        flat.push([String(it.id), it.name]);
        if (String(it.id) === id) rank = seen;
      }
      prog.textContent = "walking… page " + pages + ", " + seen + " items scanned";
      if (rank !== null || !d.nextPageCursor || !data.length) break;
      cursor = d.nextPageCursor;
      await sleep(PAGE_DELAY_MS);
    }
  } catch (e) {
    card.innerHTML = header + '<div class="err">Walk failed: ' + esc(String(e.message || e)) + ".</div>";
    return;
  }

  if (rank === null) {
    card.innerHTML = header
      + '<div class="note">Scanned ' + seen + " items in the live all-time-sales ranking for this item's neighborhood — it doesn't appear. Sales this low leave no rank to compare against, so no estimate is possible.</div>";
    return;
  }

  // 4. bracket: nearest eligible anchors above/below rank
  let above = null, below = null;
  for (let j = rank - 2; j >= 0; j--) {          // flat is 0-based; target at index rank-1
    const a = ANCHORS[flat[j][0]];
    if (a) { above = { rank: j + 1, name: flat[j][1], a }; break; }
  }
  for (let j = rank; j < flat.length; j++) {
    const a = ANCHORS[flat[j][0]];
    if (a) { below = { rank: j + 1, name: flat[j][1], a }; break; }
  }

  let html = header
    + '<div class="note">Rank <b>' + rank + "</b> of " + seen
    + " in today's all-time-sales neighborhood for this item (live walk, "
    + pages + (pages === 1 ? " page" : " pages") + ").</div>";

  if (above || below) {
    html += '<div class="lbl" style="margin-top:.6rem">Nearest evidenced neighbors</div>';
    if (above) html += '<div class="anchor">rank ' + above.rank + " · " + esc(above.name)
      + " · <b>" + fmt(above.a.p) + "</b> purchases <i>(final count, as of "
      + esc(above.a.as_of || "?") + ")</i></div>";
    html += '<div class="anchor">rank ' + rank + " · <b>" + esc(name) + "</b> (this item)</div>";
    if (below) html += '<div class="anchor">rank ' + below.rank + " · " + esc(below.name)
      + " · <b>" + fmt(below.a.p) + "</b> purchases <i>(final count, as of "
      + esc(below.a.as_of || "?") + ")</i></div>";
    if (above && below) {
      const hi = above.a.p, lo = below.a.p;
      if (hi > lo) {
        html += '<div class="lbl" style="margin-top:.6rem">Estimated total purchases</div>'
          + '<div class="bracket">' + fmt(lo) + " – " + fmt(hi) + "</div>"
          + '<div class="note">Rank-neighbor interval between the two evidenced items above. This is a comparison, not a verified bound — rankings drift and era differences within an interval can skew it.</div>';
      } else {
        html += '<div class="note">No bracket: the neighbors' + "'" + ' recorded counts contradict the ranking order, so no clean interval exists.</div>';
      }
    } else {
      html += '<div class="note">Evidence on only one side of the rank — no interval possible.</div>';
    }
  } else {
    html += '<div class="note">No evidenced neighbors anywhere on this item' + "'"
      + "s sales ranking — nothing to compare against.</div>";
  }

  html += "<details><summary>how this was computed</summary><pre>"
    + "walk: Keyword=\"" + kw + "\" SortType=2 SortAggregation=5, creator=Roblox, "
    + "includeNotForSale; " + pages + " page(s), " + seen + " items.\n"
    + "anchors: reviewed wiki purchase records, closed-final items only; "
    + "post-2021 re-releases excluded (their published counts predate the re-release).\n"
    + "walked live at " + new Date().toISOString() + "</pre></details>";
  card.innerHTML = html;
}

// ---------- helpers ----------
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function fmt(n) { return Number(n).toLocaleString("en-US"); }

// ---------- init ----------
(async function () {
  ANCHORS = await fetch("anchors_eligible.json").then(r => r.json());
  document.getElementById("go").disabled = false;
  const params = new URLSearchParams(location.search);
  if (params.get("id")) {
    document.getElementById("id").value = params.get("id");
    lookup(params.get("id"));
  }
})();
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = document.getElementById("id").value.trim();
  history.replaceState(null, "", "?id=" + encodeURIComponent(v));
  lookup(v);
});
</script>
</body>
</html>
