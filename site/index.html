<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roblox owner tracker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #101418; color: #e6e8ea;
         margin: 0; padding: 3rem 1rem; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 1.5rem; }
  h1 a { color: #9aa3ab; text-decoration: none; font-weight: 400; margin-left: .4rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input { flex: 1; padding: .65rem .9rem; font-size: 1rem; border-radius: 8px;
          border: 1px solid #2a333c; background: #161c22; color: #e6e8ea; }
  button { padding: .65rem 1.1rem; font-size: 1rem; border-radius: 8px; border: 0;
           background: #2f6fdb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .r { display: none; }
  .name { font-size: 1.1rem; font-weight: 600; }
  .hdr { display: flex; align-items: center; gap: .8rem; margin: .2rem 0 .6rem; }
  .hdr img { width: 64px; height: 64px; border-radius: 8px; background: #161c22; }
  .hdr .name { font-size: 1.1rem; font-weight: 600; }
  .hdr .sub { color: #9aa3ab; font-size: .78rem; margin-top: .15rem; }
  .num { font-size: 2.4rem; font-weight: 700; margin: .5rem 0 .1rem; }
  .cap { color: #9aa3ab; font-size: .8rem; }
  .ev { color: #9aa3ab; font-size: .8rem; margin-top: 1rem; line-height: 1.7; }
  .msg { color: #9aa3ab; margin-top: .8rem; }
  .fail { color: #e08a96; }
  .foot { color: #556069; font-size: .75rem; margin-top: 3rem; }
  .foot a { color: #556069; }
</style>
</head>
<body>
<main>
  <h1>roblox owner tracker <a href="https://github.com/TabooHarmony/roblox-owner-tracker">github</a></h1>
  <form id="f">
    <input id="id" inputmode="numeric" pattern="\d*" placeholder="catalog id" autocomplete="off" autofocus>
    <button id="go" type="submit" disabled>→</button>
  </form>
  <div id="out"></div>
  <div class="foot">ugc items, group items, non-roblox creators</div>
</main>
<script>
"use strict";
let ANCHORS = null;
const PX = "https://rbx-proxy.tabooharmony.workers.dev/";
const KW = " red orange yellow green blue pink white";
const PR = "&Limit=120&SortType=2&SortAggregation=5&IncludeNotForSale=true&CreatorName=Roblox&CreatorType=User";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => Number(n).toLocaleString("en-US");
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

async function fetchPx(path, tries) {
  let err;
  for (let i = 0; i <= tries; i++) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 20000);
    try {
      const r = await fetch(PX + path, { signal: ac.signal });
      clearTimeout(t);
      if (r.status === 429 && i < tries) { await sleep(Math.min(45000, 12000 * (i + 1))); continue; }
      if (!r.ok) throw new Error("API " + r.status);
      return await r.json();
    } catch (e) {
      clearTimeout(t);
      if (e.name === "AbortError" && i < tries) { await sleep(4000); continue; }
      err = e;
    }
  }
  throw err;
}

async function lookup(id) {
  const out = document.getElementById("out");
  const show = h => out.innerHTML = h;
  if (!/^\d+$/.test(id)) return show('<div class="msg fail">numeric catalog id</div>');
  show('<div class="msg">…</div>');

  let m;
  try { m = await fetchPx("economy.roblox.com/v2/assets/" + id + "/details", 0); }
  catch (e) { return show('<div class="msg fail">roblox api did not respond — try again in a minute</div>'); }
  if (!m || !m.Name) return show('<div class="msg fail">no item with that id — check the number and try again</div>');

  let thumb = "";
  try {
    const t = await fetchPx("thumbnails.roblox.com/v1/assets?assetIds=" + id + "&returnPolicy=PlaceHolder&size=150x150&format=Png", 0);
    if (t && t.data && t.data[0] && t.data[0].imageUrl && t.data[0].state === "Completed")
      thumb = '<img src="' + esc(t.data[0].imageUrl) + '" alt="" onerror="this.remove()">';
  } catch (e) {}
  const price = m.PriceInRobux;
  const head = '<div class="hdr">' + thumb + '<div><div class="name">' + esc(m.Name) + '</div>' +
    '<div class="sub">by ' + esc((m.Creator && m.Creator.Name) || "?") +
    (typeof price === "number" ? ' · ' + (price === 0 ? 'free' : fmt(price) + ' robux') : '') + '</div></div></div>';
  if ((m.Creator && m.Creator.Name) !== "Roblox")
    return show(head + '<div class="msg">not supported — estimates only cover items published by roblox the account, not ugc creators or groups</div>');

  let fallbackTried = false;

  async function walk(nameStr) {
    const kw = nameStr + KW;
    let cur = "", ids = [], pos = null, pages = 0;
    while (pages < 9 && pos === null) {
      const d = await fetchPx("catalog.roblox.com/v2/search/items/details?Keyword=" +
        encodeURIComponent(kw) + PR + (cur ? "&Cursor=" + encodeURIComponent(cur) : ""), 2);
      pages++;
      for (const it of d.data || []) {
        ids.push(String(it.id));
        if (String(it.id) === id) pos = ids.length;
      }
      p.textContent = "searching… " + ids.length;
      if (pos !== null || !d.nextPageCursor || !(d.data || []).length) break;
      cur = d.nextPageCursor;
      await sleep(9000);
    }
    let above = null, below = null;
    if (pos !== null) {
      for (let j = pos - 2; j >= 0; j--) if (ANCHORS[ids[j]]) { above = ANCHORS[ids[j]]; break; }
      for (let j = pos; j < ids.length; j++) if (ANCHORS[ids[j]]) { below = ANCHORS[ids[j]]; break; }
    }
    return { ids, pos, above, below };
  }

  const evOf = (a, b) => {
    let ev = "";
    if (a) ev += '<div>↑ ' + fmt(a.p) + ' — ' + esc(a.t) + ' (' + esc(a.as_of || "") + ')</div>';
    if (b) ev += '<div>↓ ' + fmt(b.p) + ' — ' + esc(b.t) + ' (' + esc(b.as_of || "") + ')</div>';
    return ev ? '<div class="ev">' + ev + '</div>' : '';
  };

  show(head + '<div class="msg" id="p">searching…</div>');
  const p = document.getElementById("p");

  let r;
  try { r = await walk(m.Name); }
  catch (e) { return show(head + '<div class="msg fail">search failed — try again in a minute</div>'); }

  const pos = r.pos, above = r.above, below = r.below;
  if (pos === null)
    return show(head + '<div class="msg">rank unresolved — too many same-word sellers ahead of it</div>');
  if (above && below && above.p > below.p)
    return show(head + '<div class="num">' + fmt(below.p) + ' – ' + fmt(above.p) + '</div><div class="cap">estimated purchases</div>' + evOf(above, below));
  if (!fallbackTried && (above || below)) {
    p.textContent = "searching (narrower keyword)…";
    const shorter = m.Name.split(/[—–\-:;(),]/)[0].trim();
    if (shorter !== m.Name && shorter.length >= 4) {
      fallbackTried = true;
      try {
        const r2 = await walk(shorter);
        if (r2.pos !== null && r2.above && r2.below && r2.above.p > r2.below.p)
          return show(head + '<div class="num">' + fmt(r2.below.p) + ' – ' + fmt(r2.above.p) + '</div><div class="cap">estimated purchases</div>' + evOf(r2.above, r2.below));
      } catch (e2) {}
    }
  }
  if (above || below)
    return show(head + '<div class="msg">no estimate — evidence on one side only</div>' + evOf(above, below));
  return show(head + '<div class="msg">no estimate — no evidence nearby</div>');
}

(async () => {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), 20000);
  let ok = false;
  try {
    const r = await fetch("anchors_eligible.json", { signal: ac.signal });
    ok = r.ok;
    if (ok) ANCHORS = await r.json();
  } catch (e) {}
  clearTimeout(t);
  if (!ok || !ANCHORS) {
    document.getElementById("out").innerHTML =
      '<div class="msg fail">could not load anchor data — refresh the page</div>';
    return;
  }
  document.getElementById("go").disabled = false;
  const v = new URLSearchParams(location.search).get("id");
  if (v) { document.getElementById("id").value = v; lookup(v); }
})();
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = document.getElementById("id").value.trim();
  history.replaceState(null, "", "?id=" + encodeURIComponent(v));
  lookup(v);
});
</script>
</body>
</html>
